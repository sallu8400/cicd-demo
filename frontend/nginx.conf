server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* requests ko API container par bhejo (docker compose ka service naam: api)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    # React app: koi bhi route ho, index.html serve karo
    location / {
        try_files $uri /index.html;
    }
}
